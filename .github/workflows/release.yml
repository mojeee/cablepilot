name: Release apps

# Push a tag like v0.2.0 to build the macOS .dmg files (Apple Silicon and Intel), the Windows installer and the Linux
# AppImage, then publish them as one GitHub Release. Unsigned for now (signing is set up later: CSC_LINK and
# APPLE_* secrets). The website's download buttons point to releases/latest/download/<file>.

on:
  push:
    tags: ['v*']
  # Or run it by hand with a version (e.g. 0.2.0): the release creates the tag v<version> on the commit it ran from.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-vite build
      - name: Package macOS (unsigned)
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/CablePilot-mac-arm64.dmg
            dist/CablePilot-mac-x64.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-vite build
      - name: Package Windows (unsigned)
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/CablePilot-win-x64.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-vite build
      - name: Package Linux AppImage
        run: npx electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/CablePilot-linux-x86_64.AppImage

  publish:
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('CablePilot {0}', inputs.version) || format('CablePilot {0}', github.ref_name) }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/CablePilot-mac-arm64.dmg
            dist/CablePilot-mac-x64.dmg
            dist/CablePilot-win-x64.exe
            dist/CablePilot-linux-x86_64.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: true
